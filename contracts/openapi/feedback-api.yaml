components:
  schemas:
    EventInput:
      type: object
      description: Input payload for creating a new feedback event for an activity.
      properties:
        activityId:
          type: string
          format: uuid
          description: Identifier of the activity the event belongs to.
        date:
          type: string
          format: date-time
          description: Scheduled start timestamp for the event.
        durationInMinutes:
          type: integer
          format: int32
        location:
          type: string
      required:
      - activityId
      - date
      - durationInMinutes
    EventDto:
      type: object
      description: "Manager-facing event summary with schedule, join details, and\
        \ question snapshot."
      properties:
        id:
          type: string
          format: uuid
          description: Stable identifier for the event.
        date:
          type: string
          format: date-time
          description: Scheduled start timestamp for the event.
        durationInMinutes:
          type: integer
          format: int32
        location:
          type: string
        pinCode:
          type: string
          description: Participant join code for submitting feedback.
        createdFromMailListener:
          type: boolean
        calendarProvider:
          type: string
