      - invitedEmails
      - owner
      - runMode
      - sendEmails
      - title
      - trend
    ActivityTrendDto:
      type: object
      description: Activity trend computed from comparable event ratings normalized
        to the 0-5 scale.
      properties:
        direction:
          type: string
          description: Trend direction across comparable events.
          enum:
          - improving
          - stable
          - declining
          - insufficient_data
        indicator:
          type: string
          description: UI indicator derived from the trend direction.
          enum:
          - positive
          - neutral
          - negative
        metric:
          type: string
          description: Metric used to compute the trend.
          enum:
          - average_rating
        latestValue:
          type: number
          format: double
        previousValue:
          type: number
          format: double
        delta:
          type: number
          format: double
        comparedEventCount:
          type: integer
          format: int32
          description: Number of events used for trend comparison.
      required:
      - comparedEventCount
      - direction
      - indicator
      - metric
