openapi: 3.1.0
info:
  title: Feedback API
  description: API documentation for Lets Grow application.
  version: v1
servers:
- url: http://localhost:18080
  description: Generated server url
security:
- bearerAuth: []
paths:
  /session/{sessionId}:
    put:
      tags:
      - Sessions
      operationId: updateSession
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Sessions
      operationId: deleteSession
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /session/mark-as-seen/{sessionId}:
    put:
      tags:
      - Sessions
      operationId: markSessionAsSeen
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/mock-new-feedback-notification:
    put:
      tags:
      - Admin
      operationId: sendNotification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationInput"
        required: true
      responses:
        "200":
          description: OK
          content: {}
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /activity/{activityId}:
    put:
      tags:
      - Activity
      operationId: updateActivity
      parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Activity
      operationId: deleteActivity
      parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account:
    put:
      tags:
      - Account
      operationId: modifyAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyAccountInput"
        required: true
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Account
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Account
      operationId: deleteAccount
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account/role:
    put:
      tags:
      - Account
      operationId: updateRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleInput"
        required: true
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account/fcm-token:
    put:
      tags:
      - Account
      operationId: linkFCMTokenToAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkFCMTokenToAccountInput"
        required: true
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /session:
    post:
      tags:
      - Sessions
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /session/join/{pinCode}:
    post:
      tags:
      - Sessions
      operationId: joinSession
      parameters:
      - name: pinCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantSessionDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /feedback/submit:
    post:
      tags:
      - Feedback
      operationId: submitFeedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitFeedbackResponseDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /feedback/start:
    post:
      tags:
      - Feedback
      operationId: startFeedbackSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartFeedbackSessionInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSessionDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/mock-id-token:
    post:
      tags:
      - Admin
      operationId: mockIdToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockIdTokenRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockTokenDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /activity:
    post:
      tags:
      - Activity
      operationId: createActivity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account/logout:
    post:
      tags:
      - Account
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutInput"
        required: true
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /notification-history/mark-as-seen:
    get:
      tags:
      - NotificationHistory
      operationId: markNotificationHistoryAsSeen
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /bootstrap:
    get:
      tags:
      - Bootstrap
      operationId: getBootstrap
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /bootstrap/bootstrap-update/{hash}:
    get:
      tags:
      - Bootstrap
      operationId: getBoostrapUpdate
      parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    SessionInput:
      type: object
      properties:
        activityId:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        durationInMinutes:
          type: integer
          format: int32
        location:
          type: string
      required:
      - activityId
      - date
      - durationInMinutes
    ActivityDto:
      type: object
      description: Manager-facing activity payload and session history for a feedback
        activity.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        agenda:
          type: string
        owner:
          $ref: "#/components/schemas/OwnerDto"
        runMode:
          type: string
          enum:
          - MANUAL
          - AUTOMATIC
        sendEmails:
          type: boolean
        invitedEmails:
          type: array
          items:
            type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionDto"
        currentQuestions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionDto"
        trend:
          $ref: "#/components/schemas/ActivityTrendDto"
      required:
      - currentQuestions
      - id
      - invitedEmails
      - owner
      - runMode
      - sendEmails
      - sessions
      - title
      - trend
    ActivityTrendDto:
      type: object
      description: Activity-level trend based on comparable session scores. Uses the
        latest sessions with numeric average rating normalized to 0-5.
      properties:
        direction:
          type: string
          enum:
          - improving
          - stable
          - declining
          - insufficient_data
        indicator:
          type: string
          enum:
          - positive
          - neutral
          - negative
        metric:
          type: string
          enum:
          - average_rating
        latestValue:
          type: number
          format: double
        previousValue:
          type: number
          format: double
        delta:
          type: number
          format: double
        comparedSessionCount:
          type: integer
          format: int32
      required:
      - comparedSessionCount
      - direction
      - indicator
      - metric
    OverallFeedbackCountStatsDto:
      type: object
      properties:
        verySadCount:
          type: integer
          format: int32
        sadCount:
          type: integer
          format: int32
        happyCount:
          type: integer
          format: int32
        veryHappyCount:
          type: integer
          format: int32
        commentsCount:
          type: integer
          format: int32
      required:
      - commentsCount
      - happyCount
      - sadCount
      - veryHappyCount
      - verySadCount
    OverallFeedbackSegmentationStatsDto:
      type: object
      properties:
        verySadPercentage:
          type: number
          format: double
        sadPercentage:
          type: number
          format: double
        happyPercentage:
          type: number
          format: double
        veryHappyPercentage:
          type: number
          format: double
      required:
      - happyPercentage
      - sadPercentage
      - veryHappyPercentage
      - verySadPercentage
    OverallFeedbackSummaryDto:
      type: object
      properties:
        segmentationStats:
          $ref: "#/components/schemas/OverallFeedbackSegmentationStatsDto"
        countStats:
          $ref: "#/components/schemas/OverallFeedbackCountStatsDto"
        unseenResponses:
          type: integer
          format: int32
        responses:
          type: integer
          format: int32
      required:
      - countStats
      - responses
      - segmentationStats
      - unseenResponses
    OwnerDto:
      type: object
      description: Basic owner metadata for an activity or session.
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
      required:
      - id
    QuestionDto:
      type: object
      description: Activity question reference.
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
      required:
      - id
      - text
    SessionDto:
      type: object
      description: Session summary for an activity. Includes scheduling and calendar
        metadata plus the feedback snapshot attached to the session.
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        durationInMinutes:
          type: integer
          format: int32
        location:
          type: string
        pinCode:
          type: string
        createdFromMailListener:
          type: boolean
        calendarProvider:
          type: string
          enum:
          - GOOGLE
          - APPLE
          - MICROSOFT
          - ZOOM
        calendarEventId:
          type: string
        averageRating:
          type: number
          format: double
        overallFeedbackSummary:
          $ref: "#/components/schemas/OverallFeedbackSummaryDto"
        questionsSnapshot:
          type: array
          items:
            $ref: "#/components/schemas/QuestionDto"
      required:
      - createdFromMailListener
      - date
      - durationInMinutes
      - id
      - questionsSnapshot
    SendNotificationInput:
      type: object
      properties:
        fcmToken:
          type: string
        title:
          type: string
        newFeedback:
          type: integer
          format: int32
        eventId:
          type: string
          format: uuid
      required:
      - eventId
      - fcmToken
      - newFeedback
      - title
    ActivityInput:
      type: object
      properties:
        title:
          type: string
        agenda:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionInput"
        runMode:
          type: string
          enum:
          - MANUAL
          - AUTOMATIC
        invitedEmails:
          type: array
          items:
            type: string
        sendEmails:
          type: boolean
      required:
      - invitedEmails
      - questions
      - runMode
      - sendEmails
      - title
    QuestionInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        questionText:
          type: string
        feedbackType:
          type: string
          enum:
          - Emoji
          - Comment
          - ThumpsUpThumpsDown
          - Opinion
          - ZeroToTen
      required:
      - feedbackType
      - questionText
    ModifyAccountInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
    UpdateRoleInput:
      type: object
      properties:
        role:
          type: string
      required:
      - role
    LinkFCMTokenToAccountInput:
      type: object
      properties:
        fcmToken:
          type: string
      required:
      - fcmToken
    OwnerInfoDto:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
    ParticipantQuestionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        questionText:
          type: string
        feedbackType:
          type: string
          enum:
          - Emoji
          - Comment
          - ThumpsUpThumpsDown
          - Opinion
          - ZeroToTen
      required:
      - feedbackType
      - id
      - questionText
    ParticipantSessionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        agenda:
          type: string
        date:
          type: string
          format: date-time
        pinCode:
          type: string
        durationInMinutes:
          type: integer
          format: int32
        location:
          type: string
        createdFromMailListener:
          type: boolean
        ownerInfo:
          $ref: "#/components/schemas/OwnerInfoDto"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantQuestionDto"
        feedbackSubmited:
          type: boolean
        recentlyJoined:
          type: boolean
      required:
      - createdFromMailListener
      - date
      - durationInMinutes
      - feedbackSubmited
      - id
      - ownerInfo
      - questions
      - recentlyJoined
      - title
    FeedbackInput:
      type: object
      properties:
        comment:
          type: string
        emoji:
          type: string
          enum:
          - VerySad
          - Sad
          - Happy
          - VeryHappy
        thumbsUpThumpsDown:
          type: string
          enum:
          - Up
          - Down
        opinion:
          type: string
          enum:
          - StronglyDisagree
          - Disagree
          - Neutral
          - Agree
          - StronglyAgree
        zeroToTen:
          type: integer
          format: int32
        questionId:
          type: string
          format: uuid
        feedbackType:
          type: string
          enum:
          - Emoji
          - Comment
          - ThumpsUpThumpsDown
          - Opinion
          - ZeroToTen
      required:
      - feedbackType
      - questionId
    SubmitFeedbackInput:
      type: object
      properties:
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackInput"
        pinCode:
          type: string
      required:
      - feedback
      - pinCode
    SubmitFeedbackResponseDto:
      type: object
      properties:
        shouldPresentRatingPrompt:
          type: boolean
        session:
          $ref: "#/components/schemas/ParticipantSessionDto"
        event:
          $ref: "#/components/schemas/ParticipantSessionDto"
      required:
      - event
      - session
      - shouldPresentRatingPrompt
    StartFeedbackSessionInput:
      type: object
      properties:
        pinCode:
          type: string
      required:
      - pinCode
    FeedbackSessionDto:
      type: object
      properties:
        title:
          type: string
        agenda:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantQuestionDto"
        ownerInfo:
          $ref: "#/components/schemas/OwnerInfoDto"
        date:
          type: string
          format: date-time
      required:
      - date
      - ownerInfo
      - questions
      - title
    MockIdTokenRequestDto:
      type: object
      properties:
        role:
          type: string
        id:
          type: string
      required:
      - id
    MockTokenDto:
      type: object
      properties:
        firebaseResponse:
          $ref: "#/components/schemas/SignInFirebaseResponseDto"
        token:
          type: string
      required:
      - firebaseResponse
      - token
    SignInFirebaseResponseDto:
      type: object
      properties:
        idToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: string
      required:
      - expiresIn
      - idToken
      - refreshToken
    CreateAccountInput:
      type: object
      properties:
        requestedRole:
          type: string
        fcmToken:
          type: string
    AccountInfoDto:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
    BootstrapDto:
      type: object
      properties:
        role:
          type: string
        accountInfo:
          $ref: "#/components/schemas/AccountInfoDto"
        participantSessions:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantSessionDto"
        managerData:
          $ref: "#/components/schemas/ManagerDataDto"
      required:
      - accountInfo
      - participantSessions
    EmojiQuestionFeedbackSummary:
      type: object
      properties:
        countVerySad:
          type: integer
          format: int32
        countSad:
          type: integer
          format: int32
        countHappy:
          type: integer
          format: int32
        countVeryHappy:
          type: integer
          format: int32
        percentageVerySad:
          type: number
          format: double
        percentageSad:
          type: number
          format: double
        percentageHappy:
          type: number
          format: double
        percentageVeryHappy:
          type: number
          format: double
      required:
      - countHappy
      - countSad
      - countVeryHappy
      - countVerySad
      - percentageHappy
      - percentageSad
      - percentageVeryHappy
      - percentageVerySad
    ManagerDataDto:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ActivityDto"
        notificationHistory:
          $ref: "#/components/schemas/NotificationHistoryDto"
        bootstrapHash:
          type: string
          format: uuid
        questionAnalytics:
          type: array
          items:
            $ref: "#/components/schemas/ManagerQuestionAnalyticsDto"
      required:
      - activities
      - bootstrapHash
      - notificationHistory
      - questionAnalytics
    ManagerQuestionAnalyticsDto:
      type: object
      properties:
        questionId:
          type: string
          format: uuid
        questionText:
          type: string
        feedbackType:
          type: string
          enum:
          - Emoji
          - Comment
          - ThumpsUpThumpsDown
          - Opinion
          - ZeroToTen
        sessionCount:
          type: integer
          format: int32
        responseCount:
          type: integer
          format: int32
        latestAskedAt:
          type: string
          format: date-time
        overallSummary:
          $ref: "#/components/schemas/QuestionFeedbackSummaryDto"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/QuestionTrendPointDto"
      required:
      - feedbackType
      - questionId
      - questionText
      - responseCount
      - sessionCount
      - timeline
    NotificationHistoryDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationHistoryItem"
        unseenTotal:
          type: integer
          format: int32
      required:
      - items
      - unseenTotal
    NotificationHistoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        eventTitle:
          type: string
        eventId:
          type: string
          format: uuid
        newFeedbackCount:
          type: integer
          format: int32
        seenByManager:
          type: boolean
      required:
      - date
      - eventId
      - eventTitle
      - id
      - newFeedbackCount
      - seenByManager
    OpinionQuestionFeedbackSummary:
      type: object
      properties:
        countStronglyAgree:
          type: integer
          format: int32
        countAgree:
          type: integer
          format: int32
        countStronglyDisagree:
          type: integer
          format: int32
        countDisagree:
          type: integer
          format: int32
        percentageStronglyAgree:
          type: number
          format: double
        percentageAgree:
          type: number
          format: double
        percentageStronglyDisagree:
          type: number
          format: double
        percentageDisagree:
          type: number
          format: double
      required:
      - countAgree
      - countDisagree
      - countStronglyAgree
      - countStronglyDisagree
      - percentageAgree
      - percentageDisagree
      - percentageStronglyAgree
      - percentageStronglyDisagree
    QuestionFeedbackSummaryDto:
