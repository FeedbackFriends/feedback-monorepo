      - questionText
    ActivityDto:
      type: object
      description: "Manager-facing activity with configuration, active questions,\
        \ event history, and trend analytics."
      properties:
        id:
          type: string
          format: uuid
          description: Stable identifier for the activity.
        title:
          type: string
          description: Display title shown to managers and participants.
        agenda:
          type: string
        owner:
          $ref: "#/components/schemas/OwnerDto"
        runMode:
          type: string
          description: Run mode that controls how events are joined and processed.
          enum:
          - MANUAL
          - AUTOMATIC
        sendEmails:
          type: boolean
