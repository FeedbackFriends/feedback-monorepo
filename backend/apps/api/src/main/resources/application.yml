server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${PORT:8090}}
  info:
    env:
      enabled: true
    java:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,beans,env
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
spring:
  application:
    name: feedback-api
  jpa:
    open-in-view: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  liquibase:
    enabled: true
  exposed:
    show-sql: ${SHOW_EXPOSED_SQL:false}
    generate-ddl: false
springdoc:
  api-docs:
    enabled: ${SPRING_DOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRING_DOC_SWAGGER_UI_ENABLED:false}
    path: /
  default-produces-media-type: application/json
feedback:
  supabase-url: ${SUPABASE_URL:}
  supabase-publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
  supabase-secret-key: ${SUPABASE_SECRET_KEY:}
  invitation-from: ${INVITATION_FROM:}
  app-url: ${LETSGROW_APP_URL:https://app.letsgrow.dk}
  firebase-service-account-json-b64: ${FIREBASE_SERVICE_ACCOUNT_JSON_B64:}
  enable-test-admin-endpoints: false
  enable-test-admin-database-reset: false
  admin-emails: ${FEEDBACK_ADMIN_EMAILS:}
logging:
  include-application-name: true
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    dk.example.feedback: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
