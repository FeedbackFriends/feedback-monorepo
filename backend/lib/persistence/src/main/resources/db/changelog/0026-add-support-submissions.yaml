databaseChangeLog:
  - changeSet:
      id: 0026-add-support-submissions
      author: codex
      comments: Product contact is separate from meeting feedback. Account deletion removes its text, contact address and metadata.
      changes:
        - createTable:
            tableName: support_submission
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: account_id
                  type: varchar(255)
                  constraints: { nullable: false }
              - column:
                  name: kind
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: rating
                  type: varchar(32)
              - column:
                  name: message
                  type: varchar(5000)
              - column:
                  name: expected_behavior
                  type: varchar(5000)
              - column:
                  name: contact_email
                  type: varchar(254)
              - column:
                  name: app_version
                  type: varchar(100)
                  constraints: { nullable: false }
              - column:
                  name: app_build
                  type: varchar(100)
                  constraints: { nullable: false }
              - column:
                  name: os_version
                  type: varchar(100)
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: support_submission
            baseColumnNames: account_id
            referencedTableName: account
            referencedColumnNames: id
            constraintName: fk_support_submission_account
            onDelete: CASCADE
        - createIndex:
            tableName: support_submission
            indexName: idx_support_submission_account
            columns:
              - column: { name: account_id }
