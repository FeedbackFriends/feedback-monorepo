databaseChangeLog:
  - changeSet:
      id: 0021-rename-session-to-event
      author: codex
      changes:
        - renameTable:
            oldTableName: session
            newTableName: event
        - renameTable:
            oldTableName: session_participant
            newTableName: event_participant
        - renameColumn:
            tableName: event_participant
            oldColumnName: session_id
            newColumnName: event_id
            columnDataType: uuid
        - renameColumn:
            tableName: question
            oldColumnName: session_id
            newColumnName: event_id
            columnDataType: uuid
        - renameColumn:
            tableName: pin_code
            oldColumnName: session_id
            newColumnName: event_id
            columnDataType: uuid
        - renameColumn:
            tableName: new_feedback_notification
            oldColumnName: session_id
            newColumnName: event_id
            columnDataType: uuid
        - renameColumn:
            tableName: notification_history
            oldColumnName: session_id
            newColumnName: event_id
            columnDataType: uuid
        - dropForeignKeyConstraint:
            baseTableName: event
            constraintName: fk_session_activity_id
        - addForeignKeyConstraint:
            baseTableName: event
            baseColumnNames: activity_id
            referencedTableName: activity
            referencedColumnNames: id
            constraintName: fk_event_activity_id
            onDelete: CASCADE
