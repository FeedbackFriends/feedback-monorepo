services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_PORT:?Set POSTGRES_PORT}:5432"
    volumes:
      - feedback-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    pull_policy: never
    image: "nicolaidam/feedback-api:local"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      FEEDBACK_ENABLE_TEST_ADMIN_ENDPOINTS: "true"
      FEEDBACK_ENABLE_TEST_ADMIN_DATABASE_RESET: "true"
    ports:
      - "8080:8080"
      - "8090:8090"

  scheduler:
    pull_policy: never
    image: "nicolaidam/feedback-scheduler:local"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "8091:8091"

  web:
    pull_policy: never
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

volumes:
  feedback-postgres-data:
