services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-feedback_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - feedback-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-feedback_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    pull_policy: never
    image: "nicolaidam/feedback-api:local"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-feedback_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "8080:8080"
      - "8090:8090"

  scheduler:
    pull_policy: never
    image: "nicolaidam/feedback-scheduler:local"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-feedback_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "8091:8091"

  web:
    pull_policy: never
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

volumes:
  feedback-postgres-data:
